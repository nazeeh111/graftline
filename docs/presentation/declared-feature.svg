<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">Graftline: a native feature without its original library</title>
<desc id="desc">Actual isolated execution expands a 336-byte Zstandard input to 139,363 matching bytes using an explicit four-register ABI and generic interpreter. A second frozen Unicode feature produces 18 bytes through the same interpreter. Virtual memory regions are schematic, not drawn to byte scale.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242228}.muted{fill:#55545e}.accent{fill:#733f63}.mono{font-family:"Courier New",Courier,monospace}</style>
<rect width="1200" height="890" fill="#f2f1f3"/>
<text x="44" y="48" font-size="30" font-weight="700" class="">graftline</text>
<text x="44" y="118" font-size="50" font-weight="700" class="">Keep the feature. Leave the library.</text>
<text x="44" y="166" font-size="18" font-weight="400" class="muted">Actual closed execution; declared ABI.</text>
<text x="44" y="228" font-size="26" font-weight="700" class="accent">Zstandard 1.5.7 decoder</text>
<text x="44" y="266" font-size="19" font-weight="700" class="">336 input bytes → 139,363 output bytes</text>
<text x="44" y="320" font-size="21" font-weight="400" class="mono">x0  output = 0x40000000</text>
<text x="44" y="358" font-size="21" font-weight="400" class="mono">x1  capacity = 150000</text>
<text x="44" y="396" font-size="21" font-weight="400" class="mono">x2  input = 0x30000000</text>
<text x="44" y="434" font-size="21" font-weight="400" class="mono">x3  input length = 336</text>
<text x="44" y="502" font-size="25" font-weight="700" class="accent">Return x0 = 139363</text>
<text x="44" y="543" font-size="17" font-weight="400" class="muted">Output SHA256</text>
<text x="44" y="574" font-size="18" font-weight="400" class="mono">9a644990a6ac1dc43c41bee4423e5974</text>
<text x="44" y="603" font-size="18" font-weight="400" class="mono">4aebb81adbe55fe9b757e29999a40d99</text>
<text x="650" y="228" font-size="26" font-weight="700" class="">Owned virtual regions</text>
<text x="650" y="279" font-size="19" font-weight="400" class="mono">0x10000000</text>
<text x="805" y="279" font-size="17" font-weight="400" class="muted">4 MiB stack</text>
<text x="650" y="339" font-size="19" font-weight="400" class="mono">0x20000000</text>
<text x="805" y="339" font-size="17" font-weight="400" class="muted">16 MiB heap arena</text>
<text x="650" y="399" font-size="19" font-weight="400" class="mono">0x30000000</text>
<text x="805" y="399" font-size="17" font-weight="400" class="muted">2 MiB input region</text>
<text x="650" y="459" font-size="19" font-weight="400" class="mono">0x40000000</text>
<text x="805" y="459" font-size="17" font-weight="400" class="muted">2 MiB output region</text>
<text x="650" y="501" font-size="15" font-weight="400" class="muted">Region map is schematic, not to scale.</text>
<text x="650" y="536" font-size="16" font-weight="400" class="muted">150000 is the caller-supplied capacity.</text>
<text x="650" y="565" font-size="16" font-weight="400" class="muted">Signature is supplied, not inferred.</text>
<text x="44" y="691" font-size="25" font-weight="700" class="">Same interpreter. Another feature.</text>
<text x="44" y="730" font-size="18" font-weight="700" class="accent">utf8proc API 2.7.0 / Unicode 14.0.0</text>
<text x="44" y="770" font-size="16" font-weight="400" class="mono">options = 1070; 22 input → 18 output bytes</text>
<text x="44" y="808" font-size="27" font-weight="400" class="mono">strasse fi a café</text>
<text x="650" y="730" font-size="20" font-weight="400" class="muted">Original libraries absent from execution.</text>
<text x="650" y="770" font-size="18" font-weight="400" class="muted">47 Zstd and 16 Unicode retained cases match.</text>
<text x="650" y="808" font-size="18" font-weight="400" class="muted">Finite evidence; source notices remain explicit.</text>
</svg>
